# Alembic Environment Configuration

[alembic]
script_location = migrations
file_template = %%(year)d%%(month).2d%%(day).2d_%%(slug)s
prepend_sys_path = .
timezone = UTC
sqlalchemy.url = postgresql://postgres:postgres@localhost:5432/hr_core_db

[post_write_hooks]

[logging]
default_handler = console

[loggers]
keys = root, alembic, sqlalchemy

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_alembic]
level = INFO
handlers = console
qualname = alembic

[logger_sqlalchemy]
level = WARN
handlers = console
qualname = sqlalchemy.engine

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
